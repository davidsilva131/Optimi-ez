[workspace]
resolver = "3"
members = ["crates/optimi-domain", "crates/optimi-windows", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
optimi-domain = { path = "crates/optimi-domain" }
optimi-windows = { path = "crates/optimi-windows" }
serde = { version = "1", features = ["derive"] }
